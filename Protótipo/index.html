<html>
  <head>
    <title>Jogo</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js"></script>
    <link rel="stylesheet" href="style.css" />
    <script type="text/javascript" src="script.js"></script>
  </head>
  <body>
    <img src="cards.png" height="250" />
    
    <section class="falas">
      <div class="fala1">
        <p>Hello, what's your favorite subject?</p>
      </div>
      
      <div class="fala2">
        <p>Hi, mine is Biology, what about yours?</p>
      </div>

      <div class="fala1">
        <p id="talk"></p>
        <p id="talk2"></p>
      </div>

    </section>

    <div class="pts">
      <img src="score.png" height="250" />
    </div>
    <div class="pause">
      <img src="pause.png" height="50" />
    </div>

    <div class="cartas">
      <button>
        <p>It's this way.</p>
        <img src="cartaverm.png" height="250" onclick="verify('fala3')" />
      </button>

      <button>
        <p>Cool! Mine is mathematics.</p>
        <img src="cartaazul.png" height="250" onclick="verify('fala1')" />
      </button>

      <button>
        <p>A crab!</p>
        <img src="cartaverm.png" height="250" onclick="verify('fala4')" />
      </button>

      <button>
        <p>Thank you very much!</p>
        <img src="cartaazul.png" height="250" onclick="verify('fala2')" />
      </button>

      <button>
        <p>I will check on that.</p>
        <img src="cartaverm.png" height="250" onclick="verify('fala6')" />
      </button>

      <button>
        <p>You might know!</p>
        <img src="cartaazul.png" height="250" onclick="verify('fala5')" />
      </button>
    </div>

  </body>
</html>
