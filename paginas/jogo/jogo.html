<html>
    <head>
        <title>Jogo</title>
        <link rel="stylesheet" href="../../css/jogo/estilojg.css" />

        <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js"></script>

        <script type="text/javascript" src="../../js/script.js" defer></script>
    </head>
    <body>
        <section class="falas">
            <div class="fala1">
                <p id="primeiraFala"></p>
            </div>

            <div class="fala2">
                <p id="segundaFala"></p>
            </div>

            <div class="fala1" id="balao1">
                <p id="talk"></p>
            </div>
            <div class="fala1" id="verificador">
                <p id="talk2"></p>
            </div>
        </section>

        <div class="pts">
            <h1 id="pts">0</h1>
            <h1 id="timer">5:00</h1>
        </div>

        <div class="pause">
            <button onclick="pausar()">
                <img src="../../imagens/jogo/pause.png" height="50" />
            </button>
        </div>

        <div class="cartas">
            <div class="cartas">
                <button>
                    <p class="textoCarta"></p>
                    <img
                        class="imagemCarta"
                        src="../../imagens/jogo/cartaverm.png"
                        height="250"
                    />
                </button>

                <button>
                    <p class="textoCarta"></p>
                    <img
                        class="imagemCarta"
                        src="../../imagens/jogo/cartaazul.png"
                        height="250"
                    />
                </button>

                <button>
                    <p class="textoCarta"></p>
                    <img
                        class="imagemCarta"
                        src="../../imagens/jogo/cartaverm.png"
                        height="250"
                    />
                </button>

                <button>
                    <p class="textoCarta"></p>
                    <img
                        class="imagemCarta"
                        src="../../imagens/jogo/cartaazul.png"
                        height="250"
                    />
                </button>

                <button>
                    <p class="textoCarta"></p>
                    <img
                        class="imagemCarta"
                        src="../../imagens/jogo/cartaverm.png"
                        height="250"
                    />
                </button>

                <button>
                    <p class="textoCarta"></p>
                    <img
                        class="imagemCarta"
                        src="../../imagens/jogo/cartaazul.png"
                        height="250"
                    />
                </button>
            </div>
        </div>
        <!-- Tela de pause: fica escondida até o jogador clicar no botão de pause -->
        <div id="telaPause" class="tela-pause">
            <button id="btnResume" class="opcao-pause" onclick="despausar()">
                RESUME
            </button>
            <button id="btnRestart" class="opcao-pause" onclick="reiniciar()">
                RESTART
            </button>
            <button id="btnQuit" class="opcao-pause" onclick="sair()">
                QUIT
            </button>
        </div>
    </body>
</html>
