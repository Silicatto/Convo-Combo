<html>
    <head>
        <meta charset="UTF-8">
<style>
body {
    background-image: url("fundo.jpeg");
    background-size: cover;
    background-position: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
}
.botao-play {
    margin-top: 150px;
    margin-bottom: 20px;
    transition: transform 0.2s ease;
}
.botao-play img {
    width: 110px;
    mix-blend-mode: multiply;
    cursor: pointer;
}
.botao-play:hover {
    transform: scale(1.1);
}
.botoes-base {
    display: flex;
    gap: 50px;
    align-items: center;
}
.botao-retro {
    background-color: #3f6494;
    color: white;
    padding: 10px 25px;
    text-decoration: none;
    border: 4px solid #000;
    border-radius: 25px;
    font-weight: bold;
    font-family: 'Courier New', Courier, monospace;
    font-size: 18px;
    letter-spacing: 1px;
    box-shadow: 3px 3px 0px rgba(0,0,0,0.8);
    transition: 0.1s;
}
.botao-retro:hover {
    background-color: #2b4566;
    transform: translate(3px, 3px);
    box-shadow: 0px 0px 0px rgba(0,0,0,0.8);
}
</style>
    </head>
        <body>
    <h1>Conversation Club</h1>
<a href="menu-inicial" class="botao-play">
<img src="play.jpeg" alt="Botão Play">
</a>
<div class="botoes-base">
<a href="index.html" class="botao-retro">SIGN IN</a>
<a href="participantes.html" class="botao-retro">ABOUT US</a>
</div>
</body>
</html>
