<html>
<head>
    <meta charset="UTF-8">
    <title>Conversation Club</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f5f5f0; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; 
        }

        .container-principal {
            background-image: url("folha.png");
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); 
            width: 800px;
            height: 450px;
            display: flex;
            align-items: center; 
            position: relative;
            overflow: hidden;
            padding: 40px 100px; 
        }

        .bloco-login {
            display: flex;
            flex-direction: column;
            width: 100%; 
            z-index: 2; 
        }

        .formulario-login {
            display: flex;
            flex-direction: column; 
            gap: 15px; 
            align-items: flex-start; 
        }

        h1 {
            background-color: rgba(220, 220, 220, 0.7); 
            padding: 10px 25px;
            border-radius: 25px; 
            width: 350px; 
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #000;
        }

        .formulario-login input {
            padding: 10px 20px;
            border: 2px solid #000;
            border-radius: 25px; 
            font-size: 16px;
            outline: none;
            width: 280px; 
        }

        .grupo-botoes {
            display: flex;
            gap: 12px; 
            margin-top: 5px;
        }
      
        .grupo-botoes button {
            color: white;
            padding: 10px 22px;
            border: none;
            border-radius: 25px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        
        .btn-entrar {
            background-color: #435b80; 
        }
        .btn-entrar:hover {
            background-color: #2b3a54; 
        }
     
        .btn-convidado {
            background-color: #d67a31; 
        }
        .btn-convidado:hover {
            background-color: #a85d21; 
        }

    </style>
</head>

<body>
<div class="container-principal">
    <div class="bloco-login">
        <form class="formulario-login">
            
            <h1>Login</h1>
            <input type="email" placeholder="Email" required>
            <input type="password" placeholder="Senha" required>
            <div class="grupo-botoes">
                <button type="submit" class="btn-entrar">Entrar</button>
                <button type="button" class="btn-convidado">Entrar como convidado</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
